[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/workspace",
    "crates/profiles",
    "crates/plan-review",
    "crates/terminal",
    "crates/agents",
    "crates/host-tools",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
thinkrail-core = { path = "crates/core" }
thinkrail-workspace = { path = "crates/workspace" }
thinkrail-profiles = { path = "crates/profiles" }
thinkrail-plan-review = { path = "crates/plan-review" }
thinkrail-terminal = { path = "crates/terminal" }
thinkrail-agents = { path = "crates/agents" }
thinkrail-host-tools = { path = "crates/host-tools" }
thinkrail-ui = { path = "crates/ui" }
gpui-kit = { version = "=0.8.1", features = ["gpui-fast"] }
anyhow = "=1.0.104"
async-channel = "=2.5.0"
base64 = "=0.23.1"
fs2 = "=0.4.3"
interprocess = "=2.4.7"
parking_lot = "=0.13.0"
portable-pty = "=0.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
vt100 = "=0.18.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
todo = "deny"
unimplemented = "deny"
