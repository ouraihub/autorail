[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/workspace",
    "crates/settings-store",
    "crates/routing",
    "crates/plan-review",
    "crates/terminal",
    "crates/agents",
    "crates/host-tools",
    "crates/observability",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
thinkrail-core = { path = "crates/core" }
thinkrail-workspace = { path = "crates/workspace" }
thinkrail-settings-store = { path = "crates/settings-store" }
thinkrail-routing = { path = "crates/routing" }
thinkrail-plan-review = { path = "crates/plan-review" }
thinkrail-terminal = { path = "crates/terminal" }
thinkrail-agents = { path = "crates/agents" }
thinkrail-host-tools = { path = "crates/host-tools" }
thinkrail-observability = { path = "crates/observability" }
thinkrail-ui = { path = "crates/ui" }
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
# Shared desktop components; pinned to a pushed LumaKit commit so CI and other machines resolve it.
lumakit-model-picker = { git = "https://github.com/ouraihub/LumaKit.git", rev = "7c46b2b9fb21c9d0d8889775d599a5d10d6499d5" }
lumakit-usage-status = { git = "https://github.com/ouraihub/LumaKit.git", rev = "7c46b2b9fb21c9d0d8889775d599a5d10d6499d5" }
anyhow = "=1.0.104"
async-channel = "=2.5.0"
base64 = "=0.23.1"
fs2 = "=0.4.3"
interprocess = "=2.4.7"
parking_lot = "=0.13.0"
portable-pty = "=0.9.0"
pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
regex = "=1.13.1"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "time"] }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std", "variable-fonts"] }
turso = { version = "=0.8.3", default-features = false }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
url = "=2.5.8"
unicode-width = "=0.2.3"
vt100 = "=0.18.1"
bytes = "=1.12.1"
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "macros", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
todo = "deny"
unimplemented = "deny"
